<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — O Mochilão Aventuras</title>
    <link rel="icon" href="/imagens/logo5.png" />
    <link rel="stylesheet" href="/STYLES/estilo.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 2rem 1rem;
        background: var(--clr-beige, #e4d7bd);
        color: var(--clr-brown-deep, #3b2a1a);
        text-align: center;
      }
      .nf {
        max-width: 440px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .nf__code {
        font-family: var(--font-display, serif);
        font-size: clamp(4.5rem, 18vw, 7rem);
        line-height: 0.9;
        margin: 0;
      }
      .nf p {
        margin: 0;
        line-height: 1.6;
      }
      .nf a {
        margin-top: 0.5rem;
        display: inline-block;
        padding: 0.85rem 1.6rem;
        border-radius: 999px;
        background: var(--clr-brown-deep, #3b2a1a);
        color: #fff;
        text-decoration: none;
        font-family: var(--font-ui, sans-serif);
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <h1 class="nf__code">404</h1>
      <p><strong>Este caminho não existe.</strong></p>
      <p>A página que procura mudou de lugar ou já não está disponível. Volte ao início e escolha a sua próxima aventura.</p>
      <a href="/">Voltar ao início</a>
    </main>
  </body>
</html>
