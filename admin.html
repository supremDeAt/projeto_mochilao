<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - O Mochilão</title>
  <link rel="icon" href="logo5.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --clr-black: #0d0a06;
      --clr-dark: #1a1208;
      --clr-brown-deep: #4d351e;
      --clr-brown-mid: #775f43;
      --clr-brown-light: #a07d55;
      --clr-gold: #c9962a;
      --clr-gold-light: #e8c56e;
      --clr-white: #ffffff;
      --clr-danger: #d32f2f;
      --clr-success: #388e3c;
      --ease-std: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: var(--clr-dark);
      color: var(--clr-white);
      line-height: 1.6;
    }

    .admin-container {
      min-height: 100vh;
      display: flex;
    }

    /* ── SIDEBAR ── */
    .admin-sidebar {
      width: 260px;
      background: var(--clr-black);
      padding: 2rem 1.5rem;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }

    .admin-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--clr-gold);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }

    .admin-nav-item {
      padding: 0.8rem 1rem;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all var(--ease-std);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 14px;
    }

    .admin-nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--clr-white);
    }

    .admin-nav-item.active {
      background: var(--clr-brown-deep);
      color: var(--clr-gold-light);
      font-weight: 600;
    }

    .admin-logout {
      margin-top: auto;
      padding: 0.8rem 1rem;
      background: var(--clr-danger);
      border-radius: 6px;
      color: var(--clr-white);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--ease-std);
    }

    .admin-logout:hover {
      background: #c62828;
    }

    /* ── MAIN CONTENT ── */
    .admin-main {
      flex: 1;
      margin-left: 260px;
      padding: 2rem;
      overflow-y: auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .admin-user {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 14px;
    }

    /* ── SEÇÃO DE UPLOAD ── */
    .upload-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .upload-section h3 {
      margin-bottom: 1.5rem;
      color: var(--clr-gold);
    }

    .upload-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
    }

    .form-group input,
    .form-group select {
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--clr-white);
      font-family: inherit;
      transition: border-color var(--ease-std);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--clr-gold);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-input-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem;
      background: rgba(201, 150, 42, 0.1);
      border: 2px dashed var(--clr-gold);
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--ease-std);
      color: var(--clr-gold-light);
      font-weight: 600;
    }

    .file-input-label:hover {
      background: rgba(201, 150, 42, 0.15);
    }

    .file-input-wrapper input[type="file"]:focus + .file-input-label {
      border-color: var(--clr-gold-light);
    }

    .file-info {
      margin-top: 0.5rem;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .upload-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease-std);
      font-family: inherit;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--clr-brown-deep);
      color: var(--clr-white);
    }

    .btn-primary:hover {
      background: var(--clr-brown-mid);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--clr-white);
    }

    .btn-secondary:hover {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-danger {
      background: var(--clr-danger);
      color: var(--clr-white);
    }

    .btn-danger:hover {
      background: #c62828;
    }

    /* ── GALERIA DE IMAGENS ── */
    .gallery-section {
      margin-top: 3rem;
    }

    .gallery-section h3 {
      margin-bottom: 1.5rem;
      color: var(--clr-gold);
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .image-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      transition: all var(--ease-std);
    }

    .image-card:hover {
      border-color: rgba(232, 197, 110, 0.3);
      transform: translateY(-4px);
    }

    .image-card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.3);
    }

    .image-card-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .image-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--clr-gold-light);
      word-break: break-all;
    }

    .image-card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .image-card-actions button {
      flex: 1;
      padding: 0.5rem;
      font-size: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all var(--ease-std);
    }

    .btn-copy {
      background: rgba(201, 150, 42, 0.2);
      color: var(--clr-gold-light);
    }

    .btn-copy:hover {
      background: rgba(201, 150, 42, 0.3);
    }

    .btn-delete {
      background: rgba(211, 47, 47, 0.2);
      color: #ff6b6b;
    }

    .btn-delete:hover {
      background: rgba(211, 47, 47, 0.3);
    }

    /* ── TOAST / NOTIFICAÇÕES ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.9);
      border-left: 4px solid var(--clr-gold);
      color: var(--clr-white);
      font-size: 14px;
      animation: slideIn 0.3s ease-out;
      z-index: 1000;
    }

    .toast.success {
      border-left-color: var(--clr-success);
    }

    .toast.error {
      border-left-color: var(--clr-danger);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--clr-gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── RESPONSIVO ── */
    @media (max-width: 768px) {
      .admin-container {
        flex-direction: column;
      }

      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 1rem;
      }

      .admin-main {
        margin-left: 0;
      }

      .upload-form {
        grid-template-columns: 1fr;
      }

      .images-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <a href="index.html" class="admin-logo">
        <i>🏔️</i> Mochilão
      </a>

      <nav class="admin-nav">
        <button class="admin-nav-item active" data-section="packages">
          📦 Pacotes
        </button>
        <button class="admin-nav-item" data-section="gallery">
          🖼️ Galeria
        </button>
        <button class="admin-nav-item" data-section="team">
          👥 Equipa
        </button>
      </nav>

      <button class="admin-logout">Logout</button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <div class="admin-header">
        <h1 id="section-title">Gerenciar Pacotes</h1>
        <div class="admin-user">
          <span>👤</span>
          <span id="user-email">admin@omochilao.ao</span>
        </div>
      </div>

      <!-- UPLOAD SECTION -->
      <div class="upload-section">
        <h3>📤 Carregar Nova Imagem</h3>
        <form class="upload-form" id="upload-form">
          <div class="form-group">
            <label for="image-name">Nome da Imagem</label>
            <input
              type="text"
              id="image-name"
              placeholder="Ex: Cabo Ledo - Dunas"
              required
            />
          </div>

          <div class="form-group">
            <label for="image-category">Categoria</label>
            <select id="image-category" required>
              <option value="">Selecione...</option>
              <option value="packages">Pacote</option>
              <option value="gallery">Galeria</option>
              <option value="team">Equipa</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: 1 / -1">
            <label>Selecionar Ficheiro</label>
            <div class="file-input-wrapper">
              <input type="file" id="image-file" accept="image/*" required />
              <label for="image-file" class="file-input-label">
                📁 Clique ou arraste ficheiro aqui
              </label>
              <div class="file-info">
                Formatos aceitos: JPEG, PNG, WebP | Tamanho máximo: 5MB
              </div>
            </div>
          </div>

          <div class="upload-actions">
            <button type="submit" class="btn btn-primary" id="upload-btn">
              Carregar Imagem
            </button>
            <button type="reset" class="btn btn-secondary">Limpar</button>
          </div>
        </form>
      </div>

      <!-- GALLERY SECTION -->
      <div class="gallery-section">
        <h3 id="gallery-title">Imagens de Pacotes</h3>
        <div class="images-grid" id="images-grid">
          <p style="grid-column: 1 / -1; color: rgba(255, 255, 255, 0.5);">
            Carregando imagens...
          </p>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js"></script>

  <!-- Config & App Script -->
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
